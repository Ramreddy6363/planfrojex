name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: planfrojex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          # Test-only throwaway database; each suite creates and drops its own schema and runs the migration.
          PLANFROJEX_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/planfrojex_test
      - run: pnpm build
      - run: pnpm --filter @planfrojex/web exec playwright install --with-deps chromium
      - run: pnpm --filter @planfrojex/web e2e
      - run: pnpm audit --audit-level high
